server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    location = /api/anfrage {
        resolver 127.0.0.11 valid=10s;
        set $mailer http://mailer:3001;
        proxy_pass $mailer;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TLS terminiert der vorgeschaltete Proxy; der Header wird unverändert durchgereicht.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Alte WordPress-URLs (SEO-Audit 2026-09-18): indexierte Seiten auf die
    # neuen Ankerziele umleiten, Ecwid-Shop und WP-Artefakte als 410 beenden.
    location = /unsere-toilettenwagen/ { return 301 /#wagen; }
    location = /kontakt/              { return 301 /#kontakt; }
    location ~ ^/wp-sitemap.*\.xml$   { return 301 /sitemap.xml; }
    location ~ ^/(shop|wp-json|wp-content|wp-includes|wp-admin)(/|$) { return 410; }

    location ~ /\. {
        deny all;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
